[project]
name = "policy-agent"
version = "0.1.0"
description = "Healthcare insurance policy RAG agent using BeeAI and AgentStack"
requires-python = ">=3.13"
dependencies = [
    "agent-framework>=1.0.0b251120",
    "agent-framework-a2a>=1.0.0b251120",
    "agentstack-sdk>=0.5.3",
    "beeai-framework[a2a]>=0.1.74",
    "google-genai",
    "pyyaml>=6.0.2",
    "langchain-text-splitters>=0.3.0,<0.4.0",
    "uvicorn>=0.30.0,<0.40.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
policy_agent = "policy_agent.agentstack_policy:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["policy_agent"]